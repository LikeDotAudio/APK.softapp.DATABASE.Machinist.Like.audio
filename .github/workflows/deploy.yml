name: Deploy to FTPS Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      # The calculators' value is their numbers: table tests of every *.math.ts and
      # src/lib/units.ts against textbook values, then the linter, before anything ships.
      - name: 🧪 Unit tests (Vitest)
        run: npm test

      - name: 🧹 Lint (oxlint)
        run: npm run lint

      # dist/ is committed and served as-is by apk.audio and every node; this
      # site builds its own. Fail before deploying when the two would differ.
      - name: 🔍 Committed dist/ matches src/
        run: npm run check:dist

      - name: 🛠️ Build project
        run: npm run build

      - name: 📂 Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./ # Change if your web root is in a subfolder like /public_html/
          log-level: verbose
