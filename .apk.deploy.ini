# Part of the APK.audio project — http://APK.audio — made by Anthony Kuzub
# How this site ships. Read by .apk.scripts/deploy_all.py in the APK.audio checkout:
# `steps` run here in order (any failure stops this site), then `local_dir` is
# mirrored to `server_dir` over FTPS — or `command` uploads instead. `env` maps
# names this site expects to slots in ~/.apk.secrets.env (never committed).
# This replaced the GitHub Actions workflow on 2026-10-31.
[deploy]
site = machinist.like.audio
steps =
    npm ci || npm install
    npm test
    npm run lint
    npm run check:dist
    npm run build
local_dir = dist
server_dir = ./
env =
    FTP_SERVER = MACHINIST_FTP_SERVER
    FTP_USERNAME = MACHINIST_FTP_USERNAME
    FTP_PASSWORD = MACHINIST_FTP_PASSWORD
